        timeoutSeconds: 20
  - id: individual-items
    label: Individual menu-item calculations
    rules:
      - kind: browser
        test: WEB-231/project2-4
        case: individual-items
        timeoutSeconds: 20
  - id: combined-items
    label: Combined menu-item calculation
    rules:
      - kind: browser
        test: WEB-231/project2-4
        case: combined-items
        timeoutSeconds: 20
  - id: deselection
    label: Totals update when a menu item is removed
    rules:
      - kind: browser
        test: WEB-231/project2-4
        case: deselection
        timeoutSeconds: 20
  - id: all-items
    label: Complete menu calculation
    rules:
      - kind: browser
        test: WEB-231/project2-4
        case: all-items
        timeoutSeconds: 20
