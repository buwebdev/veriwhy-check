# Public student assessment profile
# Author: Richard Krasso
# This file declares visible functional requirements; it contains no grade points.
id: WEB-231/assignment-2.2
course: WEB 231 Enterprise JavaScript I
assignment: "Assignment 2.2: Form validation (Project 2-2)"
version: 1.1.0
project:
  kind: static-web
  entry: project02-02.html
  locate:
    - project02-02_txt.html
requirements:
  - id: required-files
    label: Required HTML and JavaScript files
    rules:
      - kind: file-groups
        groups:
          - - project02-02.html
            - project02-02_txt.html
          - - project02-02.js
            - project02-02_txt.js
  - id: page-loads
    label: Contact form loads with required controls
    rules:
      - kind: browser
        test: WEB-231/project2-2
        case: page-loads
        timeoutSeconds: 20
  - id: blank-form
    label: Blank form displays the Please fill in all fields alert
    rules:
      - kind: browser
        test: WEB-231/project2-2
        case: blank-form
        timeoutSeconds: 20
  - id: partial-forms
    label: Every incomplete field combination displays the Please fill in all fields alert
    rules:
      - kind: browser
        test: WEB-231/project2-2
        case: partial-forms
        timeoutSeconds: 20
  - id: complete-form
    label: Complete form displays the Thank you alert
    rules:
      - kind: browser
        test: WEB-231/project2-2
        case: complete-form
        timeoutSeconds: 20
