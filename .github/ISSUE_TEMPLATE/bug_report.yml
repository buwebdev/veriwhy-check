# Structured bug-report form.
# Author: Richard Krasso
name: Bug report
description: Report a reproducible problem without sharing student work.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach assignment source, credentials, private links, or student information.
  - type: input
    id: version
    attributes:
      label: VeriWhy Check version
      placeholder: Output from veriwhy-check version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and assignment
      placeholder: Windows 11, WEB-425/lab-1.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and sanitized output
      description: Explain what you entered, expected, and observed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed student work, credentials, tokens, and private links.
          required: true
