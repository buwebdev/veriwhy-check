# Continuous integration for VeriWhy Check.
# Author: Richard Krasso
name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js from the project requirement
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests and coverage gates
        run: npm run check
      - name: Validate public YAML profiles
        run: npm run lint:yaml
      - name: Lint Markdown documentation
        run: npm run lint:md
