# Manually build and validate the VeriWhy Check Windows x64 release.
# Author: Richard Krasso
name: Manual Windows release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag to build
        required: true
        default: main
        type: string
      release_tag:
        description: Existing GitHub release tag used only when publishing
        required: true
        default: v1.0.2
        type: string
      publish:
        description: Upload the verified Windows package to the release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-x64:
    name: Build and validate Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Use the project's Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked development dependencies
        run: npm ci

      - name: Install only the notification-safe headless browser
        run: npm run setup:browser

      - name: Verify maintained source formatting
        run: npm run format:check

      - name: Run tests and coverage requirements
        run: npm run check

      - name: Validate public YAML profiles
        run: npm run lint:yaml

      - name: Lint Markdown documentation
        run: npm run lint:md

      - name: Build the Windows x64 release package
        run: npm run release:package

      - name: Verify normal Windows install, repair, PATH, and removal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Refresh-ProcessPath {
            $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            $env:Path = "$machinePath;$userPath"
          }

          function Assert-OneCommandPath([string] $commandDirectory) {
            $expected = $commandDirectory.TrimEnd("\")
            $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
            $matches = @(
              ($userPath -split ";") |
                Where-Object { $_.Trim().TrimEnd("\") -ieq $expected }
            )
            if ($matches.Count -ne 1) {
              throw "Expected exactly one VeriWhy Check PATH entry; found $($matches.Count)."
            }
          }

          $applicationRoot = Join-Path $env:LOCALAPPDATA "VeriWhy Check"
          $commandDirectory = Join-Path $applicationRoot "bin"
          $launcher = Join-Path $commandDirectory "veriwhy-check.cmd"
          $report = Join-Path $applicationRoot "reports\path-upgrade-regression.txt"
          if (Test-Path $applicationRoot) {
            Remove-Item -LiteralPath $applicationRoot -Recurse -Force
          }

          # Begin with the actual defective public release so this test proves
          # the repair path that existing students will use.
          $oldRoot = Join-Path $env:RUNNER_TEMP "veriwhy-check-v1.0.6"
          $oldArchive = Join-Path $oldRoot "veriwhy-check-windows-x64.tar.gz"
          New-Item -ItemType Directory -Force $oldRoot | Out-Null
          Invoke-WebRequest `
            "https://github.com/buwebdev/veriwhy-check/releases/download/v1.0.6/veriwhy-check-windows-x64.tar.gz" `
            -OutFile $oldArchive
          tar -xzf $oldArchive -C $oldRoot
          & (Join-Path $oldRoot "payload\runtime\node.exe") (Join-Path $oldRoot "install.mjs")
          if ($LASTEXITCODE -ne 0) { throw "The public Version 1.0.6 installer failed." }
          Refresh-ProcessPath
          if (Get-Command veriwhy-check -ErrorAction SilentlyContinue) {
            throw "Version 1.0.6 unexpectedly registered its command in PATH."
          }

          New-Item -ItemType Directory -Force (Split-Path $report) | Out-Null
          Set-Content -LiteralPath $report -Value "preserve this report"

          # Upgrade the real 1.0.6 installation with the candidate package.
          $candidateRoot = Join-Path $env:RUNNER_TEMP "veriwhy-check-candidate"
          $candidateArchive = Join-Path $PWD "tmp/releases/veriwhy-check-windows-x64.tar.gz"
          New-Item -ItemType Directory -Force $candidateRoot | Out-Null
          tar -xzf $candidateArchive -C $candidateRoot
          & (Join-Path $candidateRoot "payload\runtime\node.exe") `
            (Join-Path $candidateRoot "install.mjs")
          if ($LASTEXITCODE -ne 0) { throw "The candidate repair installation failed." }

          Refresh-ProcessPath
          if (-not (Get-Command veriwhy-check -ErrorAction SilentlyContinue)) {
            throw "The candidate installer did not make veriwhy-check discoverable by name."
          }
          Assert-OneCommandPath $commandDirectory
          if (-not (Test-Path $report)) { throw "The upgrade removed a saved report." }
          veriwhy-check version
          veriwhy-check doctor
          veriwhy-check list WEB-330

          # Reinstall the candidate over itself to prove repair idempotence.
          & (Join-Path $candidateRoot "payload\runtime\node.exe") `
            (Join-Path $candidateRoot "install.mjs")
          if ($LASTEXITCODE -ne 0) { throw "The repeated repair installation failed." }
          Refresh-ProcessPath
          Assert-OneCommandPath $commandDirectory
          if (-not (Test-Path $report)) { throw "The repeated installation removed a saved report." }
          veriwhy-check doctor

          # PATH cleanup is synchronous even though Windows may defer deletion
          # of its running private Node.js files until the command exits.
          veriwhy-check uninstall
          Refresh-ProcessPath
          if (Get-Command veriwhy-check -ErrorAction SilentlyContinue) {
            throw "Uninstallation left the VeriWhy Check command in PATH."
          }
          if (-not (Test-Path $report)) { throw "Uninstallation removed a preserved report." }

      - name: Verify, install, inspect, and uninstall the package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $PWD "tmp/releases/veriwhy-check-windows-x64.tar.gz"
          $checksum = "$archive.sha256"
          if (-not (Test-Path $archive) -or -not (Test-Path $checksum)) {
            throw "The Windows archive or checksum was not created."
          }

          $expected = ((Get-Content $checksum) -split "\s+")[0].ToLower()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            throw "The Windows release package failed its checksum validation."
          }

          $validation = Join-Path $env:RUNNER_TEMP "veriwhy-check-release-validation"
          $extracted = Join-Path $validation "extracted"
          $data = Join-Path $validation "data"
          $commands = Join-Path $validation "bin"
          New-Item -ItemType Directory -Force $extracted, $data, $commands | Out-Null
          tar -xzf $archive -C $extracted

          $entries = tar -tzf $archive
          if (-not ($entries -match "chromium_headless_shell-")) {
            throw "The Windows package does not contain the managed headless shell."
          }
          if ($entries -match "browsers/chromium-[0-9]+/") {
            throw "The Windows package unexpectedly contains the full testing browser."
          }

          $bundledNode = Join-Path $extracted "payload/runtime/node.exe"
          $installer = Join-Path $extracted "install.mjs"
          & $bundledNode $installer --data-root $data --bin-root $commands
          if ($LASTEXITCODE -ne 0) { throw "The bundled Windows installer failed." }

          $version = (Get-Content "package.json" | ConvertFrom-Json).version
          $bundledNpm = Join-Path $data "versions/$version/runtime/npm.cmd"
          $npmVersion = & $bundledNpm --version
          if ($LASTEXITCODE -ne 0 -or -not $npmVersion) {
            throw "The private npm runtime is not usable."
          }

          $launcher = Join-Path $commands "veriwhy-check.cmd"
          & $launcher version
          if ($LASTEXITCODE -ne 0) { throw "The installed version command failed." }
          & $launcher doctor
          if ($LASTEXITCODE -ne 0) { throw "The installed readiness check failed." }
          & $launcher uninstall --dry-run
          if ($LASTEXITCODE -ne 0) { throw "The uninstall preview failed." }
          & $launcher uninstall
          if ($LASTEXITCODE -ne 0) { throw "The uninstaller failed." }

          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $launcher); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $launcher) { throw "The Windows launcher was not removed." }
          if (Test-Path (Join-Path $data "versions")) {
            Write-Warning "Known Version 1 issue: the private Windows runtime remained after uninstall."
          }
          if (Test-Path (Join-Path $data "install.json")) {
            Write-Warning "Known Version 1 issue: the Windows installation record remained after uninstall."
          }

      - name: Upload the verified package to the selected release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}"
          gh release upload "${{ inputs.release_tag }}" `
            "tmp/releases/veriwhy-check-windows-x64.tar.gz" `
            "tmp/releases/veriwhy-check-windows-x64.tar.gz.sha256" `
            --clobber `
            --repo "${{ github.repository }}"
